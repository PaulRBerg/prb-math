# Creates GitHub releases automatically when version tags (e.g. v1.0.0) are pushed.
# Also syncs version branches (e.g. v4.2.0 -> v4 and release-v4).
# Stages the npm package through trusted publishing (OIDC). It publishes only after maintainer approval.
# Prerelease tags (e.g. v1.0.0-beta.1) skip the GitHub release and branch sync.
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

jobs:
  release:
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Create Github release
        uses: docker://antonyurchenko/git-release:v5
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Sync version branches with release tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: | #shell
          # Extract major version from tag (e.g., v4.2.0 -> v4)
          MAJOR_VERSION=$(echo "$TAG_NAME" | cut -d. -f1)

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Sync both branch patterns: v4 and release-v4
          for BRANCH in "$MAJOR_VERSION" "release-$MAJOR_VERSION"; do
            echo "Syncing branch '$BRANCH' with tag '$TAG_NAME'"
            git fetch origin "$BRANCH" || true
            git checkout -B "$BRANCH"
            git push origin "$BRANCH" --force
          done

  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install npm with staged publishing support
        run: npm install --global npm@11.20.0

      - name: Check the tag and derive the dist-tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: | #shell
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$TAG_NAME" != "v$VERSION" ]]; then
            echo "::error::Tag '$TAG_NAME' does not match package.json version '$VERSION'"
            exit 1
          fi

          # Prerelease identifier is the dist-tag (e.g., 1.0.0-beta.3 -> beta). Stable versions omit --tag, so npm
          # refuses to move `latest` back to an older version.
          DIST_TAG=""
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE="${VERSION#*-}"
            DIST_TAG="${PRERELEASE%%.*}"
          fi
          echo "DIST_TAG=$DIST_TAG" >> "$GITHUB_ENV"

      - name: Stage the package for approval
        run: npm stage publish ${DIST_TAG:+--tag "$DIST_TAG"}
